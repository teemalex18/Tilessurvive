    function defaultState() {
      return {
        owned: false,
        level: 120,
        stars: 0,
        skills: [1, 1, 1, 0],
        gear: GEAR_SLOTS.map(() => ({ level: 0 })),
        sigStars: 0,
      };
    }

    function normalizeSavedHeroState(heroId, value) {
      const fallback = defaultState();
      if (!value || typeof value !== "object") return fallback;
      return {
        owned: Boolean(value.owned),
        level: Math.min(150, Math.max(1, Number(value.level) || fallback.level)),
        stars: Math.min(10, Math.max(0, Number(value.stars) || 0)),
        skills: SKILL_KEYS.map((key, idx) => Math.min(
          getSkillMaxLevel(heroId, key),
          Math.max(0, Number(value.skills?.[idx]) || 0)
        )),
        gear: fallback.gear,
        sigStars: Math.min(5, Math.max(0, Number(value.sigStars) || 0)),
      };
    }

    function savedHeroState(value) {
      return {
        owned: Boolean(value.owned),
        level: value.level,
        stars: value.stars,
        skills: value.skills,
        sigStars: value.sigStars,
      };
    }

    function loadSavedStates() {
      const defaults = Object.fromEntries(HEROES.map(hero => [hero.id, defaultState()]));
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        HEROES.forEach(hero => {
          defaults[hero.id] = normalizeSavedHeroState(
            hero.id,
            saved.heroes?.[hero.id] ?? saved.states?.[hero.id]
          );
        });
      } catch (error) {
        console.warn("Не удалось загрузить сохранённые профили героев", error);
      }
      return defaults;
    }

    function defaultInventory() {

    function loadSavedInventory() {

      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        GEAR_SLOTS.forEach(slot => {
          inventory[slot.id] = Array.from({ length: 5 }, (_, idx) => Math.min(
            80,
            Math.max(0, Number(saved.inventory?.[slot.id]?.[idx]) || 0)
          ));
        });
      } catch (error) {
        console.warn("Не удалось загрузить сохранённый инвентарь", error);
      }
      return inventory;
    }

    function readStorage() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        if (!saved.heroes && saved.states) {
          saved.heroes = Object.fromEntries(HEROES.map(hero => [
            hero.id,
            savedHeroState(normalizeSavedHeroState(hero.id, saved.states[hero.id])),
          ]));
        }
        return saved;
      } catch (error) {
        console.warn("Не удалось прочитать локальное сохранение", error);
        return {};
      }
    }

    function writeStorage(value) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          version: 2,
          heroes: value.heroes || {},
          inventory: value.inventory || defaultInventory(),
        }));
        return true;
      } catch (error) {
        console.warn("Не удалось записать локальное сохранение", error);
        return false;
      }
    }

    function getSkillMaxLevel(heroId, skillKey) {
      const hero = HEROES.find(item => item.id === heroId);
      if (skillKey !== "skill_3") return 40;
      if (hero?.rarity === "SSR") return 4;
      if (hero?.rarity === "SR") return 3;

      const bpHeroId = HERO_BP_ID[heroId] || heroId;
      const skillData = BP.skill_bp?.[bpHeroId]?.[skillKey];
      if (!skillData) return 0;
      const levels = Object.keys(skillData)
        .map(Number)
        .filter(lv => skillData[String(lv)] !== null);
      return levels.length > 0 ? Math.max(...levels) : 0;
    }

    // Формула верифицирована 4/4, 2026-06-10.
    function calcHeroPower(heroId, level, rank, skills, gear) {
      const bpHeroId = HERO_BP_ID[heroId] || heroId;
      const hero = HEROES.find(item => item.id === heroId);
      const powerProfile = heroId.endsWith("_orange") ? "ORANGE" : hero?.rarity;
      const levelBP = BP.level_bp_by_rarity?.[powerProfile]?.[String(level)]
        ?? BP.level_bp[String(level)]
        ?? 0;
      const rankBP = BP.rank_bp_by_rarity?.[powerProfile]?.[String(rank)]
        ?? BP.rank_bp[String(rank)]
        ?? 0;
      const skillBP = SKILL_KEYS.reduce((sum, key, idx) => {
        const lv = skills?.[idx] ?? 0;
        if (lv === 0) return sum;
        const value = BP.skill_bp?.[bpHeroId]?.[key]?.[String(lv)] ?? null;
        return sum + (value ?? 0);
      }, 0);
      const gearBP = GEAR_SLOTS.reduce((sum, slot, idx) => {
        const lv = gear?.[idx]?.level ?? 0;
        if (lv === 0) return sum;
        const value = BP.gear_bp?.[slot.id]?.[String(lv)]?.bp ?? null;
        return sum + (value ?? 0);
      }, 0);
      return levelBP + rankBP + skillBP + gearBP;
    }

    function calcPower(heroId, st) {
      if (!st || !st.owned) return 0;
      return calcHeroPower(heroId, st.level, st.stars, st.skills, st.gear);
    }

    window.__TEAM_BUILDER_BP__ = {
      BP, calcHeroPower, getSkillMaxLevel, getFactionSynergy, calcFactionCounterPower,
      FACTION_GROUP_BONUS, FACTION_COUNTER_DAMAGE,
    };

    function getFactionSynergy(team) {
      const counts = { strong: 0, bandit: 0, airship: 0 };
      team.filter(Boolean).forEach(id => {
        const hero = HEROES.find(item => item.id === id);
        if (hero?.faction) counts[hero.faction] += 1;
      });

      let best = null;
      for (let airToStrong = 0; airToStrong <= counts.airship; airToStrong += 1) {
        const strong = counts.strong + airToStrong;
        const bandit = counts.bandit + counts.airship - airToStrong;
        const bonus = (FACTION_GROUP_BONUS[strong] || 0) + (FACTION_GROUP_BONUS[bandit] || 0);
        if (!best || bonus > best.bonus || (bonus === best.bonus && strong > best.strong)) {
          best = { strong, bandit, airToStrong, bonus };
        }
      }
      return { counts, ...(best || { strong: 0, bandit: 0, airToStrong: 0, bonus: 0 }) };
    }

    function calcFactionCounterPower(team, powers, enemyFaction) {
      if (!enemyFaction) return 0;
      return team.reduce((sum, id, idx) => {
        const hero = id ? HEROES.find(item => item.id === id) : null;
        return sum + (hero && FACTION[hero.faction]?.counters === enemyFaction
          ? powers[idx] * FACTION_COUNTER_DAMAGE
          : 0);
      }, 0);
    }

                </div>
                <select value={state.stars}
                  onChange={e => onChange({ ...state, stars: Number(e.target.value) })}
                  style={{ width: "100%", background: "#1f2937", border: "1px solid #374151",
                    borderRadius: 6, padding: "6px 8px", color: "#fbbf24", outline: "none" }}>
                  {Array.from({ length: 11 }, (_, rank) => (
                    <option key={rank} value={rank}>{rank}★</option>
                  ))}
                </select>
              </div>

              {/* Skills */}
              <div style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 11, fontWeight: 600, color: "#9ca3af", textTransform: "uppercase",
                  letterSpacing: "0.05em", marginBottom: 8 }}>
                  Навыки
                </div>
                {SKILL_LABELS.map((name, idx) => {
                  const maxLevel = getSkillMaxLevel(heroId, SKILL_KEYS[idx]);
                  const lv = Math.min(state.skills[idx] ?? 0, maxLevel);
                  return (
                    <div key={idx} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                      <span style={{ fontSize: 11, color: "#6b7280", width: 72, flexShrink: 0 }}>{name}</span>
                      <input type="range" min="0" max={maxLevel} value={lv} disabled={maxLevel === 0}
                        onChange={e => {
                          const sk = [...state.skills];
                          sk[idx] = Number(e.target.value);
                          onChange({ ...state, skills: sk });
                        }}
                        style={{ flex: 1, accentColor: rc.color }} />
                      <span style={{ fontSize: 11, fontFamily: "monospace", fontWeight: 700,
                        width: 24, textAlign: "right", color: rc.color }}>{lv}</span>
                    </div>
                  );
                })}
              </div>

              {/* Signature weapon (SSR only) */}
              {hero.rarity === "SSR" && (
                <div style={{ marginBottom: 12 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                    <span style={{ fontSize: 11, fontWeight: 600, color: "#9ca3af", textTransform: "uppercase", letterSpacing: "0.05em" }}>
                      Сигнатурное оружие
                    </span>
                    <span style={{ fontSize: 11, color: "#fb923c" }}>{state.sigStars > 0 ? `${state.sigStars}★` : "Нет"}</span>
                  </div>
                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={() => onChange({ ...state, sigStars: 0 })}
                      style={{
                        padding: "4px 8px", borderRadius: 6, border: "none", cursor: "pointer", fontSize: 11, fontWeight: 600,
                        background: state.sigStars === 0 ? "#4b5563" : "#1f2937",
                        color: state.sigStars === 0 ? "#fff" : "#6b7280",
                      }}>Нет</button>
                    {Array.from({ length: 5 }, (_, i) => (
                      <button key={i} onClick={() => onChange({ ...state, sigStars: i + 1 })}
                        style={{
                          flex: 1, padding: "4px 0", borderRadius: 6, border: "none", cursor: "pointer",
                          fontSize: 11, fontWeight: 700,
                          background: state.sigStars >= i + 1 ? "#f59e0b" : "#1f2937",
                          color: state.sigStars >= i + 1 ? "#000" : "#4b5563",
                        }}>
                        {i + 1}★
                      </button>
                    ))}
                  </div>
                </div>
              )}

              <button onClick={onSave}
                style={{
                  width: "100%", padding: "7px 0", borderRadius: 7, border: "none",
                  background: saveStatus ? "#166534" : "#f59e0b",
                  color: saveStatus ? "#bbf7d0" : "#000",
                  fontSize: 12, fontWeight: 700, cursor: "pointer", marginBottom: 10,
                }}>
                {saveStatus ? "Герой сохранён" : "Сохранить героя"}
              </button>

              <button onClick={() => onChange({ ...state, owned: false })}
                style={{ background: "none", border: "none", cursor: "pointer",
                  fontSize: 11, color: "#4b5563", padding: 0 }}
                onMouseOver={e => e.target.style.color = "#ef4444"}
                onMouseOut={e => e.target.style.color = "#4b5563"}
              >
                Убрать из коллекции
              </button>
            </div>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════
    // MAIN APP
    // ═══════════════════════════════════════════════════

    function App() {
      const [states, setStates] = useState(loadSavedStates);
      const [team, setTeam] = useState(Array(5).fill(null));
      const [selSlot, setSelSlot] = useState(null);
      const [cfgId, setCfgId] = useState(null);
      const [fltCls, setFltCls] = useState("all");
      const [fltRar, setFltRar] = useState("all");
      const [fltFaction, setFltFaction] = useState("all");
      const [fltOwned, setFltOwned] = useState(false);
      const [enemyFaction, setEnemyFaction] = useState("");
      const [savedHeroId, setSavedHeroId] = useState(null);
      const [inventorySaved, setInventorySaved] = useState(false);
      const [inventory, setInventory] = useState(loadSavedInventory);

      const powers = useMemo(() => team.map(id => id ? calcPower(id, states[id]) : 0), [team, states]);
      const total = powers.reduce((s, p) => s + p, 0);
      const maxPow = useMemo(() => Math.max(...HEROES.map(h => calcPower(h.id, states[h.id])), 1), [states]);
      const synergy = useMemo(() => getFactionSynergy(team), [team]);
      const synergyPower = Math.round(total * synergy.bonus);
      const counterPower = Math.round(calcFactionCounterPower(team, powers, enemyFaction));
      const effectiveTotal = total + synergyPower + counterPower;
      const inTeamSet = useMemo(() => new Set(team.filter(Boolean)), [team]);

      const filtered = useMemo(() => HEROES.filter(h => {
        if (fltCls !== "all" && h.cls !== fltCls) return false;
        if (fltRar !== "all" && h.rarity !== fltRar) return false;
        if (fltFaction !== "all" && h.faction !== fltFaction) return false;
        if (fltOwned && !states[h.id]?.owned) return false;
        return true;
      }), [fltCls, fltRar, fltFaction, fltOwned, states]);

      function upd(id, fn) { setStates(p => ({ ...p, [id]: fn(p[id]) })); }

      function saveHero(heroId) {
        const saved = readStorage();
        const heroes = { ...(saved.heroes || {}), [heroId]: savedHeroState(states[heroId]) };
        if (writeStorage({ ...saved, heroes })) setSavedHeroId(heroId);
      }

      function saveInventory() {
        const saved = readStorage();
        if (writeStorage({ ...saved, inventory })) setInventorySaved(true);
      }

      function assignToSlot(heroId) {
        const slot = selSlot !== null ? selSlot : team.findIndex(x => !x);
        if (slot === -1) return;
        setTeam(p => { const t = [...p]; t[slot] = heroId; return t; });
        setSelSlot(null);
      }

      function swapSuggestions(slotIdx) {
        const curId = team[slotIdx];
        return HEROES
          .filter(h => states[h.id]?.owned && !inTeamSet.has(h.id) && h.id !== curId)
          .map(h => ({ h, p: calcPower(h.id, states[h.id]) }))
          .sort((a, b) => b.p - a.p)
          .slice(0, 6);
      }

      function autoAssignGear() {
        const teamHeroes = team.filter(Boolean);
        if (teamHeroes.length === 0) return;
        GEAR_SLOTS.forEach((slot, slotIdx) => {
          const pieces = [...inventory[slot.id]].sort((a, b) => b - a);
          const ranked = teamHeroes
            .map(heroId => {
              const hero = HEROES.find(h => h.id === heroId);
              const pref = GEAR_PREF_HERO[heroId] || GEAR_PREF_CLS[hero?.cls] || [1, 1, 1];
              return { heroId, prio: pref[slotIdx], power: calcPower(heroId, states[heroId]) };
            })
            .sort((a, b) => b.prio - a.prio || b.power - a.power);
          ranked.forEach(({ heroId }, i) => {
            const level = pieces[i] ?? 0;
            upd(heroId, s => {
              const gear = [...s.gear];
              gear[slotIdx] = { level };
              return { ...s, gear };
            });
          });
        });
      }

      const suggestions = selSlot !== null ? swapSuggestions(selSlot) : [];

      return (
        <div style={{ minHeight: "100vh", background: "#030712", color: "#f3f4f6", fontFamily: "system-ui, sans-serif" }}>

          {/* ── TOP BAR ── */}
          <div style={{ background: "#111827", borderBottom: "1px solid #f59e0b33", padding: "10px 16px" }}>
            <div style={{ maxWidth: 1280, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 16 }}>
              <div>
                <div style={{ fontSize: 15, fontWeight: 900, color: "#fbbf24", letterSpacing: "0.1em", textTransform: "uppercase" }}>
                  ⚡ TILES SURVIVE — Team Builder
                </div>
                <div style={{ fontSize: 11, color: "#6b7280", marginTop: 2 }}>
                  Выбери героев · настрой · сравни силу
                </div>
              </div>
              <div style={{ textAlign: "right", flexShrink: 0 }}>
                <div style={{ fontSize: 26, fontWeight: 900, color: "#fbbf24", lineHeight: 1 }}>{effectiveTotal.toLocaleString()}</div>
                <div style={{ fontSize: 11, color: "#6b7280" }}>Оценочная сила отряда</div>
                {effectiveTotal !== total && (
                  <div style={{ fontSize: 10, color: "#4b5563", marginTop: 2 }}>Базовая: {total.toLocaleString()}</div>
                )}
              </div>
            </div>
          </div>

          <div style={{ maxWidth: 1280, margin: "0 auto", padding: 12, display: "flex", flexDirection: "column", gap: 12 }}>

            {/* ── TEAM ── */}
            <div style={{ background: "#111827", borderRadius: 8, border: "1px solid #374151", padding: 12 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12, flexWrap: "wrap" }}>
                <span style={{ fontSize: 11, fontWeight: 700, color: "#9ca3af", textTransform: "uppercase", letterSpacing: "0.05em" }}>
                  Команда · 5 героев
                </span>
                {synergy.bonus > 0 && (
                  <span style={{
                    fontSize: 11, padding: "2px 10px", borderRadius: 999, fontWeight: 700,
                    background: "#84cc1633", color: "#bef264"
                  }}>
                    Фракции {synergy.strong}+{synergy.bandit} → +{Math.round(synergy.bonus * 100)}% финального HP
                  </span>
                )}
                <select value={enemyFaction} onChange={e => setEnemyFaction(e.target.value)}
                  style={{ background: "#1f2937", border: "1px solid #374151", borderRadius: 4,
                    padding: "3px 7px", fontSize: 11, color: "#d1d5db", outline: "none" }}>
                  <option value="">Противник: не выбран</option>
                  {Object.entries(FACTION).map(([key, faction]) => (
                    <option key={key} value={key}>Противник: {faction.label}</option>
                  ))}
                </select>
                {total > 0 && (
                  <span style={{ marginLeft: "auto", fontSize: 11, color: "#4b5563" }}>
                    Нажми на слот → смотри замены
                  </span>
                )}
              </div>

              {/* 5 slots */}
              <div style={{ display: "grid", gridTemplateColumns: "repeat(5,1fr)", gap: 8 }}>
                {Array.from({ length: 5 }, (_, si) => {
                  const id = team[si];
                  const hero = id ? HEROES.find(h => h.id === id) : null;
                  const pow = powers[si];
                  const isSel = selSlot === si;
                  const cls = hero ? CLASS[hero.cls] : null;

                  return (
                    <div key={si}
                      onClick={() => { setSelSlot(isSel ? null : si); if (hero) setCfgId(hero.id); }}
                      style={{
                        borderRadius: 8,
                        border: `2px solid ${isSel ? "#f59e0b" : hero ? cls.color + "66" : "#1f2937"}`,
                        background: isSel ? "#78350f22" : hero ? "#0d1117" : "#030712",
                        padding: 8, cursor: "pointer", textAlign: "center",
                        transition: "border-color 0.15s"
                      }}>
                      {hero ? (
                        <>
                          <div style={{ fontSize: 26, marginBottom: 2 }}>{hero.emoji}</div>
                          <div style={{ fontSize: 11, fontWeight: 700, color: cls.color, lineHeight: 1.2 }}>{hero.name}</div>
                          <div style={{ fontSize: 10, color: FACTION[hero.faction]?.color }}>
                            {FACTION[hero.faction]?.icon} {FACTION[hero.faction]?.label}
                          </div>
                          <div style={{ fontSize: 13, fontWeight: 900, color: "#fbbf24", marginTop: 4 }}>{pow.toLocaleString()}</div>
                          <div style={{ height: 4, background: "#1f2937", borderRadius: 999, marginTop: 4, overflow: "hidden" }}>
                            <div style={{ height: "100%", borderRadius: 999, background: cls.color,
                              width: `${(pow / maxPow) * 100}%`, transition: "width 0.4s" }} />
                          </div>
                          <button
                            onClick={e => {
                              e.stopPropagation();
                              setTeam(p => { const t = [...p]; t[si] = null; return t; });
                              if (selSlot === si) setSelSlot(null);
                            }}
                            style={{ marginTop: 4, background: "none", border: "none", cursor: "pointer",
                              fontSize: 10, color: "#4b5563" }}
                            onMouseOver={e => e.target.style.color = "#ef4444"}
                            onMouseOut={e => e.target.style.color = "#4b5563"}
                          >✕ убрать</button>
                        </>
                      ) : (
                        <>
                          <div style={{ fontSize: 22, color: "#374151", marginBottom: 4 }}>+</div>
                          <div style={{ fontSize: 11, color: "#4b5563" }}>{isSel ? "↖ выбери" : `Слот ${si + 1}`}</div>
                        </>
                      )}
                    </div>
                  );
                })}
              </div>

              {/* Power breakdown */}
              {total > 0 && (
                <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px solid #1f2937",
                  display: "flex", alignItems: "flex-end", gap: 12 }}>
                  <div style={{ flex: 1 }}>
                    {team.map((id, i) => {
                      if (!id) return null;
                      const h = HEROES.find(x => x.id === id);
                      const cls = CLASS[h.cls];
                      const pct = (powers[i] / total) * 100;
                      return (
                        <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                          <div style={{ width: 56, textAlign: "right", fontSize: 11, color: cls.color,
                            overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{h.name}</div>
                          <div style={{ flex: 1, height: 8, background: "#1f2937", borderRadius: 999, overflow: "hidden" }}>
                            <div style={{ height: "100%", borderRadius: 999, background: cls.color, width: `${pct}%` }} />
                          </div>
                          <div style={{ width: 60, textAlign: "right", fontSize: 11, fontFamily: "monospace",
                            color: "#d1d5db" }}>{powers[i].toLocaleString()}</div>
                        </div>
                      );
                    })}
                  </div>
                  <div style={{ textAlign: "right", flexShrink: 0 }}>
                    <div style={{ fontSize: 11, color: "#6b7280" }}>Базовая сила</div>
                    <div style={{ fontSize: 16, fontWeight: 700, color: "#d1d5db" }}>{total.toLocaleString()}</div>
                    {synergyPower > 0 && (
                      <div style={{ fontSize: 11, color: "#bef264" }}>Синергия HP: +{synergyPower.toLocaleString()}</div>
                    )}
                    {counterPower > 0 && (
                      <div style={{ fontSize: 11, color: "#7dd3fc" }}>Сопротивление: +{counterPower.toLocaleString()}</div>
                    )}
                    <div style={{ fontSize: 11, color: "#6b7280", marginTop: 4 }}>Оценочная сила</div>
                    <div style={{ fontSize: 22, fontWeight: 900, color: "#fbbf24" }}>{effectiveTotal.toLocaleString()}</div>
                  </div>
                </div>
              )}
              {total > 0 && (
                <div style={{ marginTop: 8, fontSize: 10, color: "#4b5563" }}>
                  Оценочная сила применяет боевые проценты к базовой BattlePower для сравнения составов.
                  Игра не хранит прямой перевод бонуса финального HP в BattlePower.
                </div>
              )}
            </div>

            {/* ── GEAR INVENTORY ── */}
            <InventoryPanel
              inventory={inventory}
              onInventoryChange={value => { setInventory(value); setInventorySaved(false); }}
              team={team}
              states={states}
              onAutoAssign={autoAssignGear}
              onSave={saveInventory}
              saveStatus={inventorySaved}
            />

            {/* ── BOTTOM: Roster + Config ── */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>

              {/* ── ROSTER ── */}
              <div style={{ background: "#111827", borderRadius: 8, border: "1px solid #374151",
                overflow: "hidden", display: "flex", flexDirection: "column" }}>

                {/* Filters */}
                <div style={{ padding: 12, borderBottom: "1px solid #1f2937",
                  display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                  <select value={fltCls} onChange={e => setFltCls(e.target.value)}
                    style={{ background: "#1f2937", border: "1px solid #374151", borderRadius: 4,
                      padding: "4px 8px", fontSize: 11, color: "#e5e7eb", outline: "none" }}>
                    <option value="all">Все классы</option>
                    {Object.entries(CLASS).map(([k, v]) => (
                      <option key={k} value={k}>{v.label}</option>
                    ))}
                  </select>

                  <select value={fltRar} onChange={e => setFltRar(e.target.value)}
                    style={{ background: "#1f2937", border: "1px solid #374151", borderRadius: 4,
                      padding: "4px 8px", fontSize: 11, color: "#e5e7eb", outline: "none" }}>
                    <option value="all">Все редкости</option>
                    <option value="SSR">SSR</option>
                    <option value="SR">SR</option>
                    <option value="R">R</option>
                  </select>

                  <select value={fltFaction} onChange={e => setFltFaction(e.target.value)}
                    style={{ background: "#1f2937", border: "1px solid #374151", borderRadius: 4,
                      padding: "4px 8px", fontSize: 11, color: "#e5e7eb", outline: "none" }}>
                    <option value="all">Все фракции</option>
                    {Object.entries(FACTION).map(([key, faction]) => (
                      <option key={key} value={key}>{faction.label}</option>
                    ))}
                  </select>

                  <button onClick={() => setFltOwned(!fltOwned)}
                    style={{
                      padding: "4px 10px", borderRadius: 4, border: "none", cursor: "pointer", fontSize: 11, fontWeight: 600,
                      background: fltOwned ? "#f59e0b" : "#1f2937",
                      color: fltOwned ? "#000" : "#9ca3af",
                    }}>👤 Только мои</button>

                  <span style={{ marginLeft: "auto", fontSize: 11, color: "#4b5563" }}>
                    {HEROES.filter(h => states[h.id]?.owned).length} / {HEROES.length}
                  </span>
                </div>
                <div style={{ padding: "6px 12px", borderBottom: "1px solid #1f2937",
                  fontSize: 10, color: "#4b5563" }}>
                  Профили героев и инвентарь сохраняются только по соответствующей кнопке
                </div>

                {/* Hero list */}
                <div style={{ overflowY: "auto", flex: 1, maxHeight: 560 }}>
                  {filtered.map(hero => {
                    const st = states[hero.id];
                    const pow = calcPower(hero.id, st);
                    const cls = CLASS[hero.cls];
                    const rar = RARITY[hero.rarity];
                    const inTeam = inTeamSet.has(hero.id);
                    const isCfg = cfgId === hero.id;

                    return (
                      <div key={hero.id}
                        onClick={() => setCfgId(hero.id)}
                        style={{
                          display: "flex", alignItems: "center", gap: 10,
                          padding: "10px 12px", borderBottom: "1px solid #1f2937",
                          cursor: "pointer",
                          background: isCfg ? "#f59e0b0d" : "transparent",
                        }}
                        onMouseOver={e => { if (!isCfg) e.currentTarget.style.background = "#1f2937aa"; }}
                        onMouseOut={e => { e.currentTarget.style.background = isCfg ? "#f59e0b0d" : "transparent"; }}
                      >
                        {/* Owned checkbox */}
                        <button
                          onClick={e => { e.stopPropagation(); upd(hero.id, s => ({ ...s, owned: !s.owned })); }}
                          style={{
                            width: 20, height: 20, borderRadius: 4, flexShrink: 0,
                            border: `2px solid ${st.owned ? rar.color : "#374151"}`,
                            background: st.owned ? rar.color : "transparent",
                            display: "flex", alignItems: "center", justifyContent: "center",
                            cursor: "pointer",
                          }}>
                          {st.owned && <span style={{ color: "#000", fontSize: 11, fontWeight: 900 }}>✓</span>}
                        </button>

                        <span style={{ fontSize: 22, flexShrink: 0 }}>{hero.emoji}</span>

                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                            <span style={{ fontWeight: 700, fontSize: 13 }}>{hero.name}</span>
                            <TBadge tier={hero.tier} />
                          </div>
                          <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 2 }}>
                            <RBadge rarity={hero.rarity} />
                            <span style={{ fontSize: 11, color: cls.color }}>{cls.icon} {cls.label}</span>
                            <span style={{ fontSize: 11, color: FACTION[hero.faction]?.color }}>
                              {FACTION[hero.faction]?.icon} {FACTION[hero.faction]?.label}
                            </span>
                          </div>
                        </div>

                        <div style={{ textAlign: "right", flexShrink: 0, marginRight: 4 }}>
                          {st.owned ? (
                            <>
                              <div style={{ fontSize: 11, color: "#fbbf24" }}>{"★".repeat(st.stars)}</div>
                              <div style={{ fontSize: 13, fontFamily: "monospace", fontWeight: 700, color: "#e5e7eb" }}>
                                {pow.toLocaleString()}
                              </div>
                            </>
                          ) : (
                            <span style={{ fontSize: 11, color: "#4b5563" }}>нет</span>
                          )}
                        </div>

                        {st.owned && !inTeam && (
                          <button
                            onClick={e => { e.stopPropagation(); assignToSlot(hero.id); }}
                            style={{
                              flexShrink: 0, width: 28, height: 28, borderRadius: 6, border: "none",
                              fontWeight: 700, fontSize: 16, background: "#f59e0b",
                              color: "#000", cursor: "pointer",
                            }}
                            onMouseOver={e => e.target.style.background = "#fbbf24"}
                            onMouseOut={e => e.target.style.background = "#f59e0b"}
                          >+</button>
                        )}
                        {inTeam && (
                          <span style={{
                            flexShrink: 0, width: 28, height: 28, borderRadius: 6,
                            background: "#1f2937", color: "#4ade80", fontSize: 11,
                            display: "flex", alignItems: "center", justifyContent: "center"
                          }}>✓</span>
                        )}
                      </div>
                    );
                  })}
                  {filtered.length === 0 && (
                    <div style={{ padding: 32, textAlign: "center", color: "#4b5563", fontSize: 13 }}>
                      Нет героев по фильтру
                    </div>
                  )}
                </div>
              </div>

              {/* ── RIGHT PANEL ── */}
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>

                {/* Swap suggestions */}
                {selSlot !== null && suggestions.length > 0 && (
                  <div style={{ background: "#111827", borderRadius: 8, border: "1px solid #f59e0b44", padding: 12 }}>
                    <div style={{ fontSize: 11, fontWeight: 700, color: "#fbbf24", textTransform: "uppercase",
                      letterSpacing: "0.05em", marginBottom: 10 }}>
                      💡 Замены для слота {selSlot + 1} · по убыванию силы
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                      {suggestions.map(({ h, p }) => {
                        const cls = CLASS[h.cls];
                        const curPow = powers[selSlot];
                        const diff = p - curPow;
                        return (
                          <div key={h.id}
                            style={{
                              display: "flex", alignItems: "center", gap: 10,
                              padding: 8, borderRadius: 8, cursor: "pointer",
                            }}
                            onMouseOver={e => e.currentTarget.style.background = "#1f2937"}
                            onMouseOut={e => e.currentTarget.style.background = "transparent"}
                            onClick={() => {
                              setTeam(prev => { const t = [...prev]; t[selSlot] = h.id; return t; });
                              setCfgId(h.id);
                              setSelSlot(null);
                            }}>
                            <span style={{ fontSize: 20 }}>{h.emoji}</span>
                            <div style={{ flex: 1, minWidth: 0 }}>
                              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                                <span style={{ fontWeight: 700, fontSize: 13 }}>{h.name}</span>
                                <RBadge rarity={h.rarity} />
                              </div>
                              <div style={{ fontSize: 11, color: cls.color }}>{cls.icon} {cls.label}</div>
                            </div>
                            <div style={{ textAlign: "right", flexShrink: 0 }}>
                              <div style={{ fontSize: 13, fontFamily: "monospace", fontWeight: 700, color: "#e5e7eb" }}>
                                {p.toLocaleString()}
                              </div>
                              {curPow > 0 && (
                                <div style={{ fontSize: 11, fontWeight: 700,
                                  color: diff > 0 ? "#4ade80" : diff < 0 ? "#f87171" : "#6b7280" }}>
                                  {diff > 0 ? "+" : ""}{diff.toLocaleString()}
                                </div>
                              )}
                            </div>
                            <div style={{
                              width: 28, height: 28, borderRadius: 6, background: "#f59e0b",
                              color: "#000", fontSize: 14, display: "flex", alignItems: "center",
                              justifyContent: "center", fontWeight: 700, flexShrink: 0,
                            }}>↩</div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {selSlot !== null && suggestions.length === 0 && (
                  <div style={{ background: "#111827", borderRadius: 8, border: "1px solid #f59e0b44",
                    padding: 16, textAlign: "center", fontSize: 13, color: "#6b7280" }}>
                    Нет доступных замен — отметь героев как «имеющихся»
                  </div>
                )}

                {/* Hero config */}
                {cfgId ? (
                  <HeroConfigPanel
                    heroId={cfgId}
                    state={states[cfgId]}
                    onChange={ns => {
                      if (JSON.stringify(savedHeroState(ns)) !== JSON.stringify(savedHeroState(states[cfgId]))) {
                        setSavedHeroId(null);
                      }
                      upd(cfgId, () => ns);
                    }}
                    onSave={() => saveHero(cfgId)}
                    saveStatus={savedHeroId === cfgId}
                  />
                ) : (
                  <div style={{
                    background: "#111827", borderRadius: 8, border: "1px solid #374151",
                    padding: 48, textAlign: "center", color: "#4b5563", flex: 1,
                    display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center"
                  }}>
                    <div style={{ fontSize: 40, marginBottom: 12 }}>⚙️</div>
                    <div style={{ fontSize: 13 }}>
                      Нажми на героя в списке<br />чтобы настроить уровень, звёзды и навыки
                    </div>
                  </div>
                )}

              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── MOUNT ──
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
